# Local Postgres for development:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zesxai
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
